[project]
name = "personal-api"
version = "0.1.0"
description = "A self-hosted API over your own data: collectors sync into SQLite, FastAPI serves it."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "mcp>=1.10",
]

[project.scripts]
papi = "personal_api.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personal_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
